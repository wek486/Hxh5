name: Deploy Hxh5 to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build uni-app H5
        env:
          VITE_BASE_PATH: /Hxh5/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://impression-mitsubishi-wizard-tablets.trycloudflare.com' }}
        run: npm run build:h5

      - name: Prepare pages artifact
        shell: bash
        run: |
          if [ -f dist/build/h5/index.html ]; then
            echo "PAGE_DIR=dist/build/h5" >> "$GITHUB_ENV"
          elif [ -f dist/build/web/index.html ]; then
            echo "PAGE_DIR=dist/build/web" >> "$GITHUB_ENV"
          else
            echo "H5 index.html not found in dist/build/h5 or dist/build/web"
            find dist -maxdepth 4 -type f | head -80
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
